<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle ESP32</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js"></script>
</head>
<body>

<h1>Controle ESP32</h1>
<p>Status: <span id="statusText">Desconectado</span></p>

<h2>Tanque (potenciômetro)</h2>
<svg width="120" height="220" viewBox="0 0 120 220">
  <rect x="5" y="5" width="110" height="210" fill="none" stroke="black" stroke-width="3"/>
  <rect id="water" x="8" y="212" width="104" height="0" fill="#3aa0ff"/>
</svg>
<p><span id="voltVal">--</span> V (máximo 3.30 V)</p>
<p id="lastUpdate">Aguardando dados…</p>

<h2>Acionamento</h2>
<button id="actionBtn" disabled>Ligar LED (3s)</button>

<h2>Log</h2>
<div id="log"></div>

<script>
// ---------------- Configurações fixas Adafruit IO ----------------
const AIO_USER = "VictorOliveira855";
const AIO_KEY  = "aio_hYGg57gwgh1yTjBffYYphVLZniuh";
const FEED_POT = "projetoif.potenciometro";
const FEED_LED = "projetoif.botao";

let client = null;
const $ = (id) => document.getElementById(id);
const MAX_V = 3.30;

function log(msg){
  const el = document.createElement('div');
  const t = new Date().toLocaleTimeString('pt-BR');
  el.textContent = `[${t}] ${msg}`;
  $('log').prepend(el);
}

function updateTank(v){
  $('voltVal').textContent = v.toFixed(2);
  const pct = Math.max(0, Math.min(1, v / MAX_V));
  const h = 204 * pct; // altura máxima útil dentro do tanque
  $('water').setAttribute('height', h);
  $('water').setAttribute('y', 212 - h);
  $('lastUpdate').textContent = 'Última leitura: ' + new Date().toLocaleTimeString('pt-BR');
}

function connectMQTT(){
  $('statusText').textContent = 'Conectando…';
  log('Conectando ao Adafruit IO como ' + AIO_USER + '…');

  client = mqtt.connect('wss://io.adafruit.com:443/mqtt', {
    username: AIO_USER,
    password: AIO_KEY,
    clientId: 'webctrl_' + Math.random().toString(16).slice(2),
    clean: true,
    reconnectPeriod: 4000,   // tenta reconectar sozinho a cada 4s
    connectTimeout: 8000,
  });

  client.on('connect', () => {
    $('statusText').textContent = 'Conectado';
    $('actionBtn').disabled = false;
    log('Conectado. Inscrevendo no feed ' + FEED_POT + '…');
    client.subscribe(AIO_USER + '/feeds/' + FEED_POT);
  });

  client.on('message', (topic, message) => {
    if (topic.endsWith('/' + FEED_POT)) {
      const v = parseFloat(message.toString());
      if (!isNaN(v)) updateTank(v);
    }
  });

  client.on('reconnect', () => { $('statusText').textContent = 'Reconectando…'; });
  client.on('close',     () => { $('statusText').textContent = 'Reconectando…'; $('actionBtn').disabled = true; });
  client.on('error', (err) => {
    log('Erro: ' + (err && err.message ? err.message : err));
    $('statusText').textContent = 'Erro de conexão';
  });
}

$('actionBtn').addEventListener('click', () => {
  if (!client || !client.connected) return;
  client.publish(AIO_USER + '/feeds/' + FEED_LED, '1');
  log('Comando enviado ao feed ' + FEED_LED + ' (LED por 3s).');
});

// Conecta automaticamente assim que a página carrega
connectMQTT();
</script>
</body>
</html>
